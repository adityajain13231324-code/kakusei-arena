<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KAKUSEI ARENA — VFX / Audio dev harness</title>
<style>
  html, body { margin:0; height:100%; background:#0a0a14; color:#dde; font:12px/1.3 system-ui, sans-serif; overflow:hidden; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:330px; overflow-y:auto; background:rgba(8,8,20,.82); padding:8px; box-sizing:border-box; }
  #panel h4 { margin:10px 0 4px; color:#ff9b3a; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  #panel button { margin:2px 2px 0 0; padding:4px 7px; background:#232344; color:#eef; border:1px solid #556; border-radius:3px; cursor:pointer; font-size:11px; }
  #panel button:hover { background:#3a3a70; }
  #panel select, #panel label { font-size:11px; }
  #stats { position:fixed; left:6px; top:6px; font:11px monospace; color:#9fd; white-space:pre; text-shadow:0 0 3px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats"></div>
<div id="panel"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>

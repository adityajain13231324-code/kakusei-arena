<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAKUSEI ARENA | Asset inspection v2</title>
<style>body{margin:0;background:#141b2a;color:#e8edf7;font:14px system-ui;overflow:hidden}header{padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0}select,button{background:#29354a;color:white;border:1px solid #627087;border-radius:5px;padding:7px}#status{margin-left:auto;color:#b7c5dc}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head>
<body><header><h1>KAKUSEI ARENA / fighter v2</h1>
<select id="fighter"><option>kaito</option><option>shiori</option><option>ren</option><option>goro</option><option>mika</option><option>lyra</option><option>kitsu</option><option>daichi</option><option>aiko</option><option>seraph</option><option>koji</option><option>oboro</option></select>
<select id="expr"><option>neutral</option><option>shout</option><option>pain</option><option>determined</option></select>
<select id="pose"><option>rest</option><option>punch</option><option>kick</option><option>crouch</option></select>
<button id="awake">Awaken</button><button id="view">Rotate view</button><button id="zoom">Face</button><span id="status">Loading</span></header>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {configureFighter} from '/characters/toon-materials.js';
const q=new URLSearchParams(location.search);
const H=()=>innerHeight-(q.has('bare')?0:54);
if(q.has('bare'))document.querySelector('header').style.display='none';
const scene=new THREE.Scene();scene.background=new THREE.Color('#25314a');
const camera=new THREE.PerspectiveCamera(30,innerWidth/H(),.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,H());document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a7390,1.6));const light=new THREE.DirectionalLight(0xffffff,2.6);light.position.set(-2,4,4);scene.add(light);
const rim=new THREE.DirectionalLight(0x9fc4ff,1.2);rim.position.set(2,2,-4);scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(1.2,48),new THREE.MeshBasicMaterial({color:'#1b2436'}));ground.rotation.x=-Math.PI/2;scene.add(ground);
let cur='kaito',root,style,awakened=false,view=0,zoom=false,currentPose='rest',faceUV=null,faceMesh=null;const rest=new Map();
const loader=new GLTFLoader(),status=document.querySelector('#status');
const EX={neutral:0,shout:.25,pain:.5,determined:.75};
async function load(name){
 status.textContent='Loading';window.assetReady=false;cur=name;document.querySelector('#fighter').value=name;
 if(root){scene.remove(root);style.dispose()}
 root=(await loader.loadAsync(`/characters/${name}/model.glb`)).scene;scene.add(root);
 style=await configureFighter(root,name);
 if(name==='goro')style.attachShoulderPlates((await loader.loadAsync('/characters/goro/shoulder_plates.glb')).scene);
 if(name==='kitsu')style.attachShoulderPlates((await loader.loadAsync('/characters/kitsu/awakened_tails.glb')).scene);
 rest.clear();root.traverse(o=>{if(o.isBone)rest.set(o.name,o.quaternion.clone())});
 faceMesh=null;root.traverse(o=>{if(o.isMesh&&o.name==='Face_Expressions'&&!faceMesh)faceMesh=o});
 faceUV=faceMesh?faceMesh.geometry.attributes.uv.array.slice():null;
 awakened=false;setView();setExpr(document.querySelector('#expr').value);setPose(document.querySelector('#pose').value);
 status.textContent=name.toUpperCase();window.assetReady=true;
}
function setExpr(e){if(!faceMesh)return;const a=faceMesh.geometry.attributes.uv;for(let i=0;i<a.count;i++){a.array[i*2]=faceUV[i*2]+EX[e]}a.needsUpdate=true}
const R=(x,y,z)=>new THREE.Quaternion().setFromEuler(new THREE.Euler(THREE.MathUtils.degToRad(x),THREE.MathUtils.degToRad(y),THREE.MathUtils.degToRad(z)));
const POSES={rest:{},
 punch:{RightArm:[0,0,62],RightForeArm:[0,0,18],LeftArm:[-35,0,-20],LeftForeArm:[-110,0,0],Spine1:[8,-15,0],LeftUpLeg:[-25,0,0],LeftLeg:[30,0,0],RightUpLeg:[15,0,0],fist:1},
 kick:{LeftUpLeg:[-95,0,0],LeftLeg:[20,0,0],RightLeg:[15,0,0],RightUpLeg:[-10,0,0],LeftArm:[-30,0,-25],LeftForeArm:[-100,0,0],RightArm:[-30,0,25],RightForeArm:[-100,0,0],fist:1},
 crouch:{LeftUpLeg:[-80,0,-10],LeftLeg:[110,0,0],RightUpLeg:[-80,0,10],RightLeg:[110,0,0],Hips:[0,0,0],Spine:[25,0,0],LeftArm:[-40,0,-30],LeftForeArm:[-100,0,0],RightArm:[-40,0,30],RightForeArm:[-100,0,0],fist:1}};
function setPose(p){if(!root)return;currentPose=p;for(const [n,qq] of rest){const b=root.getObjectByName(n);if(b)b.quaternion.copy(qq)}
 if(cur==='kitsu'){if(p!=='rest')for(const [n,x]of [['FrontLeftUpLeg',-35],['FrontLeftLeg',50],['HindRightUpLeg',30],['Tail_02',25]]){const b=root.getObjectByName(n);if(b)b.quaternion.multiply(R(x,0,0))}return}
 const P=POSES[p];for(const [n,v] of Object.entries(P)){if(n==='fist')continue;const b=root.getObjectByName(n);if(b)b.quaternion.multiply(R(...v))}
 if(P.fist)for(const s of ['Left','Right'])for(const f of ['Index','Middle','Ring','Pinky','Thumb'])for(const j of [1,2,3]){const b=root.getObjectByName(`${s}Hand${f}${j}`);if(b)b.quaternion.multiply(R(f==='Thumb'?(j===1?20:45):(j===1?75:95),0,0))}
 if(root){const box=new THREE.Box3().setFromObject(root);/* keep feet on floor for crouch */}
 if(p==='crouch'){root.position.y=-.28*(cur==='goro'?1.2:1)}else root.position.y=0;
}
function setView(){const s=cur==='goro'?1.2:cur==='oboro'?1.3:1;const a=view*Math.PI/4;
 if(cur==='kitsu'){camera.fov=30;camera.updateProjectionMatrix();const d=zoom?1.5:3.9;camera.position.set(Math.sin(a)*d,zoom?.68:.57,Math.cos(a)*d);camera.lookAt(0,zoom?.64:.46,zoom?.4:-.12);return}
 if(zoom){camera.fov=16;camera.position.set(Math.sin(a)*1.7*s,1.68*s,Math.cos(a)*1.7*s);camera.updateProjectionMatrix();camera.lookAt(0,1.66*s,0)}
 else{camera.fov=30;camera.updateProjectionMatrix();const distance=currentPose==='rest'?4.6:5.8;camera.position.set(Math.sin(a)*distance*s,1.05*s,Math.cos(a)*distance*s);camera.lookAt(0,.95*s,0)}}
document.querySelector('#fighter').onchange=e=>load(e.target.value);
document.querySelector('#expr').onchange=e=>setExpr(e.target.value);
document.querySelector('#pose').onchange=e=>setPose(e.target.value);
document.querySelector('#awake').onclick=()=>{awakened=!awakened;style.setAwakened(awakened)};
document.querySelector('#view').onclick=()=>{view=(view+1)%8;setView()};
document.querySelector('#zoom').onclick=()=>{zoom=!zoom;setView()};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/H();camera.updateProjectionMatrix();renderer.setSize(innerWidth,H())});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
window.assetApp={load,scene,renderer,setExpr,setPose,get root(){return root},get style(){return style},
 set(o){if('view'in o)view=o.view;if('zoom'in o)zoom=o.zoom;if('awake'in o){awakened=o.awake;style.setAwakened(awakened)}if('expr'in o)setExpr(o.expr);if('pose'in o)setPose(o.pose);setView()}};
load(q.get('fighter')||'kaito');
</script></body></html>
